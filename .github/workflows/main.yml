
name: Recolector deportivo

      - name: Comprobar conexión configurada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          url = make_url(os.environ["DATABASE_URL"])
          print("Usuario:", url.username)
          print("Servidor:", url.host)
          print("Puerto:", url.port)
          print("Base de datos:", url.database)
          PY

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar recolector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collector.py live
